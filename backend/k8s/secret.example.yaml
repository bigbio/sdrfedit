# Copy this to secret.yaml, fill in real values, and `kubectl apply -f secret.yaml`.
# secret.yaml is gitignored -- never commit real keys.
apiVersion: v1
kind: Secret
metadata:
  name: sdrf-assistant-secrets
  namespace: sdrf-assistant
type: Opaque
stringData:
  # Leave empty if pride-llm-api on hh-44 doesn't require a key (internal-only access).
  LLM_API_KEY: ""
  EMBEDDING_API_KEY: ""
  MINERU_API_KEY: ""
