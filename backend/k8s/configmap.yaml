apiVersion: v1
kind: ConfigMap
metadata:
  name: sdrf-assistant-config
  namespace: sdrf-assistant
data:
  ROOT_PATH: "/pride/services/sdrf-assistant"
  # Restrict to the actual SDRF Editor frontend origin(s) in production.
  CORS_ORIGINS: "https://www.ebi.ac.uk"

  # ---------- LLM: pride-llm-api on the hh-44 cluster ----------
  # TODO confirm the actual reachable base URL for pride-llm-api on hh-44
  # (internal DNS if hh-11 and hh-44 share a network, otherwise an ingress
  # path such as https://www.ebi.ac.uk/pride/services/pride-llm-api/v1).
  # LLM_API_KEY (if pride-llm-api needs one) goes in secret.yaml, not here.
  LLM_BASE_URL: "http://pride-llm-api.hh-44.ebi.ac.uk/v1"
  LLM_MODEL: "gpt-4o-mini"
  LLM_TEMPERATURE: "0.2"
  LLM_MAX_TOOL_ROUNDS: "16"
  LLM_TIMEOUT_SECONDS: "120"

  # ---------- Embeddings ----------
  # Point at pride-llm-api too if it also serves an OpenAI-compatible
  # /embeddings endpoint; otherwise point at whatever embedding provider is
  # actually configured (EMBEDDING_API_KEY goes in secret.yaml).
  EMBEDDING_BASE_URL: "http://pride-llm-api.hh-44.ebi.ac.uk/v1"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_BATCH_SIZE: "10"

  # ---------- MinerU (PDF parsing) ----------
  MINERU_MODE: "api"
  MINERU_FLAVOR: "official"
  MINERU_BASE_URL: "https://mineru.net/api/v4"
  MINERU_TIMEOUT_SECONDS: "300"
  MINERU_POLL_INTERVAL_SECONDS: "5"

  # ---------- Misc ----------
  MAX_UPLOAD_MB: "30"
  SESSION_TTL_SECONDS: "7200"
